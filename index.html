<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一天话题节奏 · 杭州城市热力</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="话题节奏">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .topbar { display: flex; align-items: center; gap: 18px; padding: 14px 22px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 16px; letter-spacing: .5px; }
  .tabs { display: flex; gap: 8px; }
  .tab { padding: 8px 16px; border-radius: 8px; cursor: pointer; background: transparent;
    border: 1px solid var(--line); color: var(--muted); transition: .15s; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); border-color: var(--muted); }
  .live-btn { margin-left: auto; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
  .live-btn:hover { color: var(--text); border-color: var(--muted); }
  .main { height: calc(100% - 59px); position: relative; overflow: hidden; }
  .view { height: 100%; display: none; }
  .view.active { display: block; }
  .map-box { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 500; background: rgba(22,27,34,.92);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 13px;
    backdrop-filter: blur(6px); }
  .panel h3 { margin: 0 0 6px; font-size: 14px; }
  .src { color: var(--muted); font-size: 12px; }

  /* rhythm 页面布局 */
  #view-rhythm { position: relative; flex-direction: column; overflow-y: auto; }
  #view-rhythm.active { display: flex; }
  #rhythm-chart { flex: 1 1 auto; min-height: 0; position: relative; }
  #rhythm-info { top: 16px; left: 16px; max-width: 300px; }
  #rhythm-info .desc { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 6px; }
  #rhythm-live { margin-top: 12px; font-size: 12px; color: var(--muted); max-height: 150px; overflow: auto; }
  .mood-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 20px; color: #fff; flex: none; }
  .mood-正面,.mood-愉悦,.mood-亢奋 { background: #2ea043; }
  .mood-负面,.mood-焦虑,.mood-烦躁,.mood-伤感,.mood-低落 { background: #e63946; }
  .mood-中性 { background: #6e7681; }
  #band-panel { position: absolute; z-index: 500; top: 16px; right: 16px; width: 260px; }
  #band-panel .band { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  #topic-cards { position: relative; z-index: 500; display: flex; gap: 14px;
    padding: 0 16px 14px; }
  .topic-card { flex: 1; background: rgba(22,27,34,.92); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(6px); }
  .topic-card h4 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .topic-card .day-icon { font-size: 18px; }
  .topic-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px;
    background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 13px; }
  .tag .mini { font-size: 11px; padding: 1px 7px; border-radius: 20px; color: #fff; }

  /* hangzhou 页面 */
  #hangzhou-controls { top: 16px; left: 16px; width: 260px; }
  .row { margin-bottom: 10px; }
  .row label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
  input, select { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 13px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  .btn { width: 100%; padding: 9px; border-radius: 8px; border: none; background: var(--accent);
    color: #fff; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn:hover { opacity: .9; }
  .switch-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .layer-tog { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    color: var(--muted); cursor: pointer; font-size: 12px; flex: 1; }
  .layer-tog.active { color: var(--text); border-color: var(--accent); }
  .coords { color: var(--accent); font-weight: 600; }
  #map-status { bottom: 16px; left: 16px; font-size: 12px; color: var(--muted); }
  .legend { position: absolute; z-index: 500; right: 16px; bottom: 16px; background: rgba(22,27,34,.9);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 12px; }
  .legend .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

  /* 手机端 PWA 适配 */
  @media (max-width: 700px) {
    .topbar { gap: 10px; padding: 10px 12px; }
    .brand { font-size: 14px; }
    .tab { padding: 7px 12px; font-size: 13px; }
    .live-btn { margin-left: 0; width: 100%; order: 3; text-align: center; }
    #rhythm-info { position: relative; top: auto; left: auto; width: 100%; max-width: none;
      margin: 0; border-radius: 0; border-left: 0; border-right: 0; border-top: 0; order: -1; }
    #band-panel { display: none; }
    #topic-cards { flex-direction: column; padding: 0 10px 10px; }
    #rhythm-chart { min-height: 440px; max-height: none; }
    #hangzhou-controls { top: 10px; left: 10px; right: 10px; width: auto; }
    .legend { display: none; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">🌗 一天话题节奏</div>
  <div class="tabs">
    <div class="tab active" data-view="rhythm">一天话题节奏</div>
    <div class="tab" data-view="hangzhou">杭州城市热力</div>
  </div>
  <button class="live-btn" id="live-btn">⚡ 抓取此刻热搜</button>
</div>

<div class="main">
  <!-- 一天话题节奏 -->
  <div class="view active" id="view-rhythm">
    <div id="rhythm-chart"></div>
    <div class="panel" id="rhythm-info">
      <h3>🌗 大家的一天在聊什么</h3>
      <div class="src" id="rhythm-src">数据源：演示样本</div>
      <div class="src" id="auto-sample" style="margin-top:4px;"></div>
      <div class="desc">横轴是一天 0–24 时。颜色代表不同话题类别，深浅是此刻的讨论热度。
        <b>白天</b>工作/通勤/社会新闻占据主导，<b>深夜</b>情感/娱乐/emo 浮上来。</div>
      <div id="rhythm-live"></div>
      <div class="mood-pills" id="rhythm-mood"></div>
    </div>
    <div class="panel" id="band-panel">
      <div style="font-weight:600;margin-bottom:8px;">时段标记</div>
      <div class="band"><span class="swatch" style="background:#ffd166"></span>白天 · 焦虑 / 忙碌</div>
      <div class="band"><span class="swatch" style="background:#1e6fd9"></span>深夜 · 情感 / 放松</div>
      <div class="band"><span class="swatch" style="background:#ff7a45"></span>你现在此刻</div>
    </div>
    <div id="topic-cards">
      <div class="topic-card">
        <h4><span class="day-icon">☀️</span>白天（8–20）大家在焦虑 / 关注</h4>
        <div class="topic-tags" id="day-tags"></div>
      </div>
      <div class="topic-card">
        <h4><span class="day-icon">🌙</span>深夜（22–02）大家在聊</h4>
        <div class="topic-tags" id="night-tags"></div>
      </div>
    </div>
  </div>

  <!-- 杭州城市热力 -->
  <div class="view" id="view-hangzhou">
    <div class="map-box" id="hz-map"></div>
    <div class="panel" id="hz-controls" style="top:16px;left:16px;width:300px;">
      <h3>🌆 杭州城市热力</h3>
      <div class="switch-row">
        <button class="layer-tog active" data-layer="temp">🌡️ 温度</button>
        <button class="layer-tog" data-layer="rain">🌧️ 降水</button>
        <button class="layer-tog" data-layer="air">🌫️ 空气</button>
        <button class="layer-tog" data-layer="density">🏢 繁华</button>
        <button class="layer-tog" data-layer="events">📰 事件</button>
      </div>
      <div class="hint" style="color:var(--muted);font-size:12px;margin-top:8px;">实时天气/空气来自 Open-Meteo 公开接口。</div>
      <div id="hz-basemap" style="color:var(--muted);font-size:12px;margin-top:4px;">底图：加载中…</div>
    </div>
    <div class="panel" id="hz-legend" style="right:16px;bottom:16px;">
      <div id="legend-title" style="font-weight:600;margin-bottom:6px;">🌡️ 温度 (°C)</div>
      <div class="grad-bar" id="hz-grad" style="width:180px;height:10px;border-radius:6px;margin:6px 0;"></div>
      <div style="display:flex;justify-content:space-between;width:180px;"><span id="leg-low">凉</span><span id="leg-high">热</span></div>
    </div>
    <div class="panel" id="hz-status" style="bottom:16px;left:16px;font-size:12px;color:var(--muted);">载入中…</div>
  </div>
</div>

<script src="vendor/echarts.min.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-heat.js"></script>
<script>
// ---------- 页面切换 ----------
const tabs = document.querySelectorAll('.tab');
const views = document.querySelectorAll('.view');
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.toggle('active', x === t));
  views.forEach(v => v.classList.toggle('active', v.id === 'view-' + t.dataset.view));
  if (t.dataset.view === 'hangzhou' && !hzInitialized) initHangzhou();
  if (t.dataset.view === 'rhythm' && rhythmChart) rhythmChart.resize();
}));

// ---------- 一天话题节奏 ----------
let rhythmChart = null, rhythmDone = false, lastRhythm = null;

// 外部来源（微博热搜词、事件文本）会被插进 innerHTML，必须先转义，防 DOM XSS。
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function renderTags(el, topics) {
  el.innerHTML = topics.map(t =>
    `<span class="tag">${esc(t.word)}<span class="mini mood-${esc(t.mood)}">${esc(t.mood)}</span></span>`
  ).join('');
}

async function loadRhythm(live) {
  const btn = document.getElementById('live-btn');
  if (live) { btn.textContent = '⏳ 抓取中…'; btn.disabled = true; }
  try {
    const res = await fetch('/api/rhythm' + (live ? '?live=1' : ''));
    const data = await res.json();
    renderRhythm(data);
  } catch (e) {
    console.error(e);
    document.getElementById('rhythm-src').textContent = '数据源：加载失败';
  } finally {
    btn.textContent = '⚡ 抓取此刻热搜'; btn.disabled = false;
  }
}

function renderRhythm(data) {
  if (!rhythmChart) {
    rhythmChart = echarts.init(document.getElementById('rhythm-chart'));
  }
  lastRhythm = data;
  const isMobile = window.innerWidth < 700;
  const cats = data.categories;
  const nowHour = data.now_hour;
  const hours = Array.from({length: 24}, (_, i) => i + ':00');
  const heatData = [];
  cats.forEach((c, ci) => c.hourly.forEach((v, h) => {
    if (v > 0) heatData.push([h, ci, v]);
  }));
  const maxVal = Math.max(...cats.flatMap(c => c.hourly));
  rhythmChart.setOption({
    backgroundColor: 'transparent',
    grid: { left: isMobile ? 82 : 120, right: isMobile ? 26 : 82,
      top: isMobile ? 40 : 268, bottom: 40 },
    tooltip: { position: 'top', backgroundColor: 'rgba(22,27,34,.95)', borderColor: '#30363d',
      textStyle: { color: '#e6edf3' },
      formatter: p => `<b>${p.value[1] != null ? cats[p.value[1]].name : ''}</b><br/>${hours[p.value[0]]} · 热度 ${p.value[2]}` },
    xAxis: { type: 'category', data: hours, splitArea: { show: false },
      axisLine: { lineStyle: { color: '#30363d' } }, axisLabel: { color: '#8b949e', interval: 1 } },
    yAxis: { type: 'category', data: cats.map(c => c.name),
      axisLine: { lineStyle: { color: '#30363d' } },
      axisLabel: { color: '#e6edf3', fontSize: isMobile ? 11 : 14 } },
    visualMap: { min: 0, max: maxVal, calculable: false, orient: 'vertical', right: 8,
      top: 'center', itemWidth: 10, itemHeight: 100,
      textStyle: { color: '#8b949e' },
      inRange: { color: ['#21262d', '#1e90ff', '#3ad29f', '#ffd166', '#ff7a45', '#e63946'] } },
    series: [{ type: 'heatmap', data: heatData, label: { show: false },
      emphasis: { itemStyle: { borderColor: '#fff', borderWidth: 1 } } }],
  });
  // 叠加昼夜背景 + 此刻竖线（用另一个 series 的 markArea）
  horizonChart(rhythmChart, cats, nowHour);

  const srcEl = document.getElementById('rhythm-src');
  if (data.source === 'weibo-sampled' || data.source === 'weibo-live') {
    const st = data.status || {};
    const covered = st.coverage_hours ?? 0;
    const pct = st.learning_pct ?? 0;
    const progress = data.source === 'weibo-live'
      ? '微博实时热搜（此刻）'
      : `微博热搜采样累计 ${st.sample_count ?? 0} 次 · 覆盖 ${covered}/24 时段 · 已按真实数据学习 ${pct}%`;
    srcEl.textContent = `数据源：${progress}`;
    srcEl.title = '未被采样的时段暂用演示基线，持续点击“抓取此刻热搜”会越画越真实';
  } else {
    srcEl.textContent = '数据源：演示样本 · 一天节奏（未采集到热搜）';
  }
  renderTags(document.getElementById('day-tags'), data.day);
  renderTags(document.getElementById('night-tags'), data.night);
  const live = data.live;
  const liveEl = document.getElementById('rhythm-live');
  const moodEl = document.getElementById('rhythm-mood');
  if (live && live.topics && live.topics.length) {
    liveEl.innerHTML = `<div style="margin-bottom:6px;">此刻热搜 · 主导情绪：<b>${esc(live.mood)}</b></div>` +
      live.topics.slice(0, 5).map(t => `<div>· ${esc(t.word)}</div>`).join('');
    moodEl.innerHTML = '';
  } else {
    liveEl.innerHTML = '<div>点击右上角「抓取此刻热搜」，把当前真实话题画到时间轴上。</div>';
  }
}

function horizonChart(chart, cats, nowHour) {
  // 昼夜背景色带用 heatmap 同一 series 的 markArea 实现
  const bandData = [[
    { xAxis: '7:00', itemStyle: { color: 'rgba(255,209,102,.10)' } },
    { xAxis: '20:00', itemStyle: { color: 'rgba(255,209,102,.10)' } }
  ], [
    { xAxis: '22:00', itemStyle: { color: 'rgba(30,111,217,.12)' } },
    { xAxis: '23:00', itemStyle: { color: 'rgba(30,111,217,.12)' } }
  ], [
    { xAxis: '0:00', itemStyle: { color: 'rgba(30,111,217,.12)' } },
    { xAxis: '2:00', itemStyle: { color: 'rgba(30,111,217,.12)' } }
  ]];
  chart.setOption({
    series: [{
      type: 'heatmap',
      markArea: { silent: true, data: bandData },
      markLine: { silent: true, symbol: 'none',
        data: [{ xAxis: nowHour + ':00', lineStyle: { color: '#ff7a45', width: 2 },
          label: { formatter: '此刻', color: '#ff7a45', position: 'insideEndTop' } }] }
    }]
  });
}

// ---------- 杭州城市热力 ----------
const HZ_CENTER = [30.25, 120.16];
const HZ_BBOX = { lat0: 30.00, lat1: 30.42, lng0: 120.00, lng1: 120.42 };
let hzMap = null, hzInitialized = false;
let hzPoints = [];      // [{lat,lng,temp,precip}]
let hzHeat = null;
let hzMarkers = null;
let hzAqiLoaded = false;
let hzDensity = null;   // {cells:[{lat,lng,value}]}
let hzEvents = [];      // [{lat,lng,type,title,time}]
let activeLayer = 'temp';

async function initHangzhou() {
  const lay = new URLSearchParams(location.search).get('layer');
  if (['temp', 'rain', 'air', 'density', 'events'].includes(lay)) activeLayer = lay;
  hzMap = L.map('hz-map').setView(HZ_CENTER, 12);
  addBaseLayer(0);
  document.querySelectorAll('.layer-tog[data-layer]').forEach(b =>
    b.addEventListener('click', () => { activeLayer = b.dataset.layer; renderHeat(); }));
  document.querySelectorAll('.layer-tog[data-layer]').forEach(b =>
    b.classList.toggle('active', b.dataset.layer === activeLayer));
  await Promise.all([loadWeather(), loadUrban()]);
  hzInitialized = true;
}

// ---------- 底图：多源自动兜底 ----------
// 所有源都是标准 Web Mercator(WGS84) 坐标系，与热力点完全对齐，
// 因此切换底图不会造成热力层偏移。先试最可能可达的源，失败自动切下一个。
const BASE_PROVIDERS = [
  { name: 'Esri 街道图', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', maxZoom: 19, attribution: '© Esri' },
  { name: 'CARTO', url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', subdomains: 'abcd', maxZoom: 20, attribution: '© OpenStreetMap · © CARTO' },
  { name: 'OpenStreetMap', url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', subdomains: 'abc', maxZoom: 19, attribution: '© OpenStreetMap' },
];
let baseIndex = 0, baseLayer = null, baseErrs = 0;
const BASE_ERR_THRESHOLD = 6;

function updateBaseHint(msg) {
  const el = document.getElementById('hz-basemap');
  if (el) el.textContent = msg;
}

function addBaseLayer(fromIndex) {
  if (fromIndex >= BASE_PROVIDERS.length) {
    updateBaseHint('⚠️ 所有底图源都不可用，请检查网络后刷新');
    return;
  }
  baseIndex = fromIndex;
  baseErrs = 0;
  if (baseLayer) hzMap.removeLayer(baseLayer);
  const p = BASE_PROVIDERS[fromIndex];
  baseLayer = L.tileLayer(p.url, {
    maxZoom: p.maxZoom, attribution: p.attribution, subdomains: p.subdomains || 'abc',
  });
  baseLayer.on('tileload', () => { baseErrs = 0; updateBaseHint(`底图：${p.name} · 正常`); });
  baseLayer.on('tileerror', () => {
    if (baseIndex !== fromIndex) return; // 已经切走了
    baseErrs++;
    if (baseErrs >= BASE_ERR_THRESHOLD) {
      if (fromIndex < BASE_PROVIDERS.length - 1) {
        updateBaseHint(`底图“${p.name}”不可用，自动切换备用源…`);
        setTimeout(() => { if (baseIndex === fromIndex) addBaseLayer(fromIndex + 1); }, 800);
      } else {
        updateBaseHint('⚠️ 所有底图源都不可用，请检查网络后刷新');
      }
    } else if (baseErrs >= 2) {
      updateBaseHint(`底图：${p.name}（部分瓦片加载失败，重试中…）`);
    }
  });
  baseLayer.addTo(hzMap);
  updateBaseHint(`底图：${p.name} · 加载中…`);
}

async function loadWeather() {
  const { lats, lngs } = buildGrid();
  const url = 'https://api.open-meteo.com/v1/forecast?latitude='
    + lats.join(',') + '&longitude=' + lngs.join(',')
    + '&current=temperature_2m,precipitation';
  try {
    const res = await fetch(url);
    const data = await res.json();
    const list = (data || []).slice(0, lats.length).filter((d) => d && d.current);
    // 用请求网格坐标定位，而非 Open-Meteo 返回值：其多地点响应的坐标会
    // 偏移/四舍五入（如请求 30.0 返回 29.9824），直接用会让热力点整体漂移。
    hzPoints = list.map((d, i) => ({
      lat: lats[i], lng: lngs[i],
      temp: d.current.temperature_2m, precip: d.current.precipitation,
    }));
    document.getElementById('hz-status').textContent =
      `已加载 ${hzPoints.length} 个格点 · Open-Meteo`;
    renderHeat();
  } catch (e) {
    document.getElementById('hz-status').textContent = '天气加载失败：' + e;
  }
}

function buildGrid() {
  const step = 0.04, lats = [], lngs = [];
  for (let la = HZ_BBOX.lat0; la <= HZ_BBOX.lat1 + 0.001; la += step) {
    for (let ln = HZ_BBOX.lng0; ln <= HZ_BBOX.lng1 + 0.001; ln += step) {
      lats.push(+la.toFixed(3)); lngs.push(+ln.toFixed(3));
    }
  }
  return { lats, lngs };
}

async function loadAirQuality() {
  const { lats, lngs } = buildGrid();
  const url = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude='
    + lats.join(',') + '&longitude=' + lngs.join(',')
    + '&current=european_aqi,pm2_5';
  const res = await fetch(url);
  const data = await res.json();
  const list = (data || []).filter((d) => d && d.current);
  if (!hzPoints.length) {
    hzPoints = list.map(d => ({ lat: d.latitude, lng: d.longitude, aqi: d.current.european_aqi, pm25: d.current.pm2_5 }));
  } else {
    // 天气与空气用完全相同的网格与顺序请求，因此按“下标”合并即可。
    // 注意：Open-Meteo「空气多地点」会把坐标四舍五入到 1 位小数，
    // “按坐标匹配”会全部落空（天气接口返回的坐标又不同），故不能用坐标匹配。
    list.forEach((d, i) => {
      if (hzPoints[i]) {
        hzPoints[i].aqi = d.current.european_aqi;
        hzPoints[i].pm25 = d.current.pm2_5;
      }
    });
  }
  hzAqiLoaded = true;
}

function lerpColor(a, b, t) {
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
}
function tempColor(v, min, max) {
  const t = (v - min) / (max - min || 1);
  const stops = [[30,144,255],[58,210,159],[255,209,102],[255,122,69],[230,57,70]];
  const p = t * (stops.length - 1), i = Math.floor(p), f = p - i;
  return i >= stops.length - 1 ? lerpColor(stops[stops.length-1], stops[stops.length-1], 0) : lerpColor(stops[i], stops[i+1], f);
}
function rainColor(v, max) {
  const t = max > 0 ? v / max : 0;
  const stops = [[209,227,255],[74,163,255],[30,111,217],[11,47,107]];
  const p = t * (stops.length - 1), i = Math.floor(p), f = p - i;
  return i >= stops.length - 1 ? lerpColor(stops[stops.length-1], stops[stops.length-1], 0) : lerpColor(stops[i], stops[i+1], f);
}

async function loadUrban() {
  try { hzDensity = await (await fetch('/hz_density.json')).json(); }
  catch (e) { console.error('density', e); }
  try { hzEvents = await (await fetch('/events.json')).json(); }
  catch (e) { console.error('events', e); }
  // 若用户在这之前已切到“繁华/示例事件”，数据到位后补一次渲染，
  // 避免状态一直停在“加载中”。
  if (hzMap && (activeLayer === 'density' || activeLayer === 'events')) renderHeat();
}

async function renderHeat() {
  if (hzHeat) hzMap.removeLayer(hzHeat);
  if (hzMarkers) hzMap.removeLayer(hzMarkers);
  let pts = [], grad;
  const title = document.getElementById('legend-title');
  const low = document.getElementById('leg-low');
  const high = document.getElementById('leg-high');
  const bar = document.getElementById('hz-grad');
  const status = document.getElementById('hz-status');

  if (activeLayer === 'temp' || activeLayer === 'rain') {
    const key = activeLayer === 'temp' ? 'temp' : 'precip';
    const vals = hzPoints.map(p => p[key]);
    const min = vals.length ? Math.min(...vals) : 0;
    const max = vals.length ? Math.max(...vals) : 1;
    const range = (max - min) || 1;
    grad = activeLayer === 'temp'
      ? { 0.0: '#3b82f6', 0.25: '#22c55e', 0.5: '#eab308', 0.75: '#f97316', 1.0: '#dc2626' }
      : { 0.0: '#bfe3ff', 0.4: '#4aa3ff', 0.7: '#1e6fd9', 1.0: '#0b2f6b' };
    pts = hzPoints.map(p => [p.lat, p.lng, (p[key] - min) / range]);
    if (activeLayer === 'temp') {
      title.textContent = '🌡️ 温度 (°C)';
      low.textContent = `凉 ${min.toFixed(1)}°`; high.textContent = `热 ${max.toFixed(1)}°`;
      bar.style.background = 'linear-gradient(90deg,#3b82f6,#22c55e,#eab308,#f97316,#dc2626)';
      status.textContent = `已加载 ${hzPoints.length} 个格点 · 实时温度`;
    } else {
      title.textContent = '🌧️ 降水 (mm)';
      low.textContent = max <= 0.01 ? '无雨' : '小雨'; high.textContent = max.toFixed(2) + ' mm';
      bar.style.background = 'linear-gradient(90deg,#bfe3ff,#4aa3ff,#1e6fd9,#0b2f6b)';
      status.textContent = max <= 0.01 ? '当前杭州无降水' : `已加载 ${hzPoints.length} 个格点 · 实时降水`;
    }
  } else if (activeLayer === 'air') {
    if (!hzAqiLoaded) {
      status.textContent = '正在加载实时空气 (AQI)…';
      try {
        await loadAirQuality();
      } catch (e) {
        status.textContent = '空气加载失败：' + e;
        hzAqiLoaded = false;
        return;
      }
    }
    const aqi = hzPoints.map(p => p.aqi).filter(v => v != null);
    const min = aqi.length ? Math.min(...aqi) : 0;
    const max = aqi.length ? Math.max(...aqi) : 1;
    const range = (max - min) || 1;
    grad = { 0.0: '#22c55e', 0.25: '#eab308', 0.5: '#f97316', 0.75: '#dc2626', 1.0: '#a855f7' };
    pts = hzPoints.filter(p => p.aqi != null).map(p => [p.lat, p.lng, (p.aqi - min) / range]);
    title.textContent = '🌫️ 空气 (European AQI)';
    low.textContent = `优 ${min}`;
    high.textContent = `差 ${max}`;
    bar.style.background = 'linear-gradient(90deg,#22c55e,#eab308,#f97316,#dc2626,#a855f7)';
    status.textContent = `已加载 ${pts.length} 个格点 · 实时空气 (Open-Meteo)`;
  } else if (activeLayer === 'density') {
    if (!hzDensity) { status.textContent = '繁华数据加载中…'; return; }
    const cells = hzDensity.cells, max = cells[0] ? cells[0].value : 1;
    grad = { 0.0: '#cfe8ff', 0.25: '#67c56e', 0.5: '#e6c34a', 0.78: '#f0893b', 1.0: '#e0332f' };
    pts = cells.map(c => [c.lat, c.lng, Math.pow(c.value / max, 0.35)]);
    title.textContent = '🏢 繁华程度'; low.textContent = '低'; high.textContent = '高';
    bar.style.background = 'linear-gradient(90deg,#cfe8ff,#67c56e,#e6c34a,#f0893b,#e0332f)';
    status.textContent = `繁华度 · ${cells.length} 网格（${hzDensity.meta.source === 'demo' ? '演示数据' : '真实 POI'}）`;
  } else if (activeLayer === 'events') {
    if (!hzEvents.length) { status.textContent = '事件数据加载中…'; return; }
    grad = { 0.0: '#22c55e', 0.5: '#eab308', 1.0: '#dc2626' };
    pts = hzEvents.map(e => [e.lat, e.lng, 1]);
    title.textContent = '📰 新闻 / 事件'; low.textContent = '少'; high.textContent = '多';
    bar.style.background = 'linear-gradient(90deg,#22c55e,#eab308,#dc2626)';
    status.textContent = `共 ${hzEvents.length} 条示例事件（非实时） · 点击红点看详情`;
  }

  hzHeat = L.heatLayer(pts, { radius: 62, blur: 40, maxZoom: 15, gradient: grad });
  hzHeat.addTo(hzMap);
  if (activeLayer === 'events') {
    hzMarkers = L.layerGroup();
    hzEvents.forEach(e => {
      L.circleMarker([e.lat, e.lng], {
        radius: 7, color: '#fff', weight: 1, fillColor: '#dc2626', fillOpacity: .92,
      }).bindPopup(`<b>${esc(e.type)}</b> · ${esc(e.title)}<br/>${esc(e.time)}<br/><span style="color:var(--muted)">（示例事件 · 非实时）</span>`).addTo(hzMarkers);
    });
    hzMarkers.addTo(hzMap);
  }
}

// 窗口尺寸变化时重算图表（适配手机/桌面切换）
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (rhythmChart && lastRhythm) renderRhythm(lastRhythm);
    if (hzMap) hzMap.invalidateSize();
  }, 300);
});

// ---------- 自动采样（打开页面时每 15 分钟静默抓一次热搜） ----------
const AUTO_SAMPLE_MIN = 15;
let lastAutoSample = null;

function updateAutoBadge() {
  const el = document.getElementById('auto-sample');
  if (!el) return;
  el.textContent = lastAutoSample
    ? `自动采样每 ${AUTO_SAMPLE_MIN} 分钟 · 上次 ${lastAutoSample.toTimeString().slice(0, 5)}`
    : `自动采样每 ${AUTO_SAMPLE_MIN} 分钟`;
}

async function autoSample() {
  try {
    const res = await fetch('/api/rhythm?live=1');
    const data = await res.json();
    lastAutoSample = new Date();
    if (rhythmChart) renderRhythm(data);
    else document.getElementById('rhythm-src').textContent =
      data.source === 'weibo-sampled' || data.source === 'weibo-live'
        ? '数据源：微博实时热搜（自动采样）' : '数据源：演示样本';
  } catch (e) { /* 静默失败，下轮再试 */ }
  updateAutoBadge();
}

// ---------- 初始化 ----------
window.addEventListener('load', () => {
  loadRhythm(false);
  const params = new URLSearchParams(location.search);
  if (params.get('view') === 'hangzhou') {
    const tab = document.querySelector('.tab[data-view="hangzhou"]');
    if (tab) tab.click();
  }
  if (['1', 'true'].includes(params.get('live'))) loadRhythm(true);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
  updateAutoBadge();
  setInterval(autoSample, AUTO_SAMPLE_MIN * 60 * 1000);
});
document.getElementById('live-btn').addEventListener('click', () => loadRhythm(true));
</script>
